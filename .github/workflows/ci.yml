name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and API contract tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Install Chromium for RTL smoke tests
        run: npm exec --prefix web -- playwright install --with-deps chromium
      - name: Desktop and mobile RTL browser tests
        run: npm run test:e2e
      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            web/test-results
            web/playwright-report
          if-no-files-found: ignore
